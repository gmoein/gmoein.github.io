// Pure sample reversal: preserve N, channel count and sample rate exactly.
function reverseBuffer(context,input){
 const output=context.createBuffer(input.numberOfChannels,input.length,input.sampleRate);
 for(let c=0;c<input.numberOfChannels;c++){
  const x=input.getChannelData(c),y=output.getChannelData(c);
  for(let n=0;n<x.length;n++)y[n]=x[x.length-1-n];
 }
 return output;
}

   if(node?.port){node.port.onmessage=null;node.port.close();}
   if(this.analyser===analyser)this.analyser=null;

  };
  const finish=(buffer,error)=>{if(settled)return;settled=true;cleanup();if(error)rejectCapture(error);else resolveCapture(buffer);};
  const rec={stop:()=>{},abort:()=>finish(null,fault('aborted'))};this.rec=rec;
  stream.getAudioTracks().forEach(track=>track.onended=()=>finish(null,fault('busyMic')));
  try{
   let worklet=false;
   if(context.audioWorklet&&window.AudioWorkletNode){
    try{
     if(this.moduleContext!==context){
      // Inline Blob keeps the entire implementation in this HTML file.
      const code=`class Capture extends AudioWorkletProcessor{
       constructor(){super();this.parts=[];this.count=0;this.done=false;this.max=Math.floor(sampleRate*10);this.port.onmessage=e=>{if(e.data==='stop')this.flush();};}
       flush(){if(this.done)return;this.done=true;const channels=this.parts.map(parts=>{const a=new Float32Array(this.count);let offset=0;for(const p of parts){a.set(p,offset);offset+=p.length;}return a;});this.port.postMessage({channels},channels.map(a=>a.buffer));this.parts=[];}
       process(inputs){if(this.done)return false;const input=inputs[0];if(!input||!input.length||!input[0].length)return true;if(!this.parts.length)this.parts=input.map(()=>[]);const n=Math.min(input[0].length,this.max-this.count);for(let c=0;c<this.parts.length;c++)this.parts[c].push(new Float32Array((input[c]||input[0]).subarray(0,n)));this.count+=n;if(this.count>=this.max)this.flush();return !this.done;}

      try{await deadline(context.audioWorklet.addModule(url),5000);this.moduleContext=context;}finally{URL.revokeObjectURL(url);}
     }
     if(epoch!==this.epoch||settled)throw fault('aborted');
     node=new AudioWorkletNode(context,'rvc-capture',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
     node.port.onmessage=e=>{
      try{const channels=e.data.channels;if(!channels?.length||!channels[0].length)throw fault('short');
       onProcessing();const b=context.createBuffer(channels.length,channels[0].length,context.sampleRate);

   }
   if(!worklet){
    if(!window.MediaRecorder)throw fault('unsupported');
    const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];

     }catch(error){finish(null,error);}

 stop(){this.rec?.stop();}
 stopPlayback(){const source=this.source;this.source=null;if(source){source.onended=null;try{source.stop();source.disconnect();}catch(_){}}if(!this.rec&&this.analyser){try{this.analyser.disconnect();}catch(_){}this.analyser=null;}}

  this.stopPlayback();const epoch=this.epoch,context=await this.ensure();

  source.buffer=buffer;source.playbackRate.value=1;source.connect(analyser);analyser.connect(context.destination);

const audio=new AudioEngine();
function save(){try{const checkpoint={...match,lang};if(state==='NEXT_ROUND'){checkpoint.speaker=1-match.speaker;checkpoint.round=match.round+1;}localStorage.setItem(KEY,JSON.stringify(checkpoint));}catch(_){storageFailed=true;}}
function errorText(error){const code=error?.code;if(code&&TEXT[lang][code])return t(code);return t(({NotAllowedError:'denied',SecurityError:'denied',NotFoundError:'missing',NotReadableError:'busyMic',AbortError:'audioError'})[error?.name]||'audioError');}
function showError(s){message=s;$('error').textContent=s;}
function toast(s){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),3500);}
function freeRound(){operation++;phase='idle';audio.dispose();original=reversed=imitation=result=null;heard=resultHeard=originalHeard=false;guess='';}
function go(next){if(!EDGES[state]?.includes(next))return false;audio.stopPlayback();state=next;phase='idle';message='';render();$('announcer').textContent=$('stageTitle')?.textContent||t('title');return true;}
function button(action,label,style='primary',disabled=false){return `<button type="button" data-action="${action}" class="${style}" ${disabled?'disabled':''}>${label}</button>`;}
function busy(){return phase!=='idle';}
function wave(){const status=t(phase==='recording'?'recording':phase==='playing'?'playing':phase==='preparing'?'preparing':phase==='processing'?'processing':'idle');return `<div class="audio-panel"><canvas id="wave" width="600" height="100" aria-label="${esc(status)}"></canvas><div class="audio-meta ${phase==='recording'?'active':''}"><span id="micStatus" role="status">${status}</span><span id="clock" class="clock">${phase==='recording'?'10.0 / 10 s':'PCM · ↶'}</span></div></div>`;}
function controls(playAction,playLabel){return phase==='playing'?button('stopPlay',t('stopPlay'),'secondary'):button(playAction,t(playLabel),'secondary',busy());}
function recordControls(action,label){if(phase==='recording')return button('stopRecord',t('stopRecord'),'danger big');if(phase==='preparing'||phase==='processing')return button('cancelAudio',t('cancel'),'ghost');return button(action,t(label),'primary big',busy());}
function scoreboard(){return `<div class="scoreboard">${match.names.map((_,i)=>`<div class="score ${i===1-match.speaker?'active':''}"><div class="name">${name(i)}</div><div class="points">${num(match.scores[i])} <small>/ ${num(match.target)}</small></div></div>`).join('')}</div><div class="meta"><span>${t('round')} ${num(match.round)}</span><span>${t('goal')}: ${num(match.target)}</span></div>`;}
function stage(title,hint,content,icon='↶'){return `<section class="card"><p class="eyebrow">${t(state==='PLAYER1_RECORD'?'speaker':'guesser')} · ${name(state==='PLAYER1_RECORD'?match.speaker:1-match.speaker)}</p><h2 id="stageTitle">${title}</h2><p class="sub">${hint}</p>${content}</section>`;}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('language').value=lang;$('language').disabled=busy();$('privacy').textContent=t('privacy');$('error').textContent=message;
 let html='';
 if(state==='SETUP'){
  html=`<section class="hero"><p class="eyebrow">${t('tag')}</p><h1>${t('title')}</h1><p class="sub">${t('intro')}</p></section><section class="card"><form id="setup"><div class="row"><div><label for="name1">${t('p1')}</label><input id="name1" maxlength="40" value="${esc(match.names[0])}" placeholder="${t('default1')}" autocomplete="off"></div><div><label for="name2">${t('p2')}</label><input id="name2" maxlength="40" value="${esc(match.names[1])}" placeholder="${t('default2')}" autocomplete="off"></div></div><label for="target">${t('target')}</label><select id="target">${[3,5,10].map(n=>`<option value="${n}" ${match.target===n?'selected':''}>${num(n)}</option>`).join('')}<option value="custom" ${![3,5,10].includes(match.target)?'selected':''}>${t('custom')}</option></select><div id="customWrap" ${[3,5,10].includes(match.target)?'hidden':''}><label for="customTarget">${t('customLabel')}</label><input id="customTarget" type="number" inputmode="numeric" min="1" max="999" step="1" value="${match.target}"></div><div class="actions"><button class="primary big" type="submit">${t('start')}</button></div></form>${match.active?`<div class="actions">${button('resume',t('resume'),'ghost')}<p class="hint">${t('resumeHint')}</p></div>`:''}<p class="hint">${storageFailed?t('storage'):t('savedLabel')}</p></section><details><summary>${t('helpTitle')}</summary><p>${t('help')}</p></details>`;
 }else{
  html=scoreboard();const index=['PLAYER1_RECORD','HANDOFF','PLAYER2_LISTEN','PLAYER2_IMITATE','PLAYER2_LISTEN_RESULT','GUESS','REVEAL','SCORING','NEXT_ROUND','GAME_OVER'].indexOf(state);
  html+=`<div class="steps" aria-hidden="true">${Array.from({length:5},(_,i)=>`<i class="${i<=Math.floor(index/2)?'on':''}"></i>`).join('')}</div>`;
  const locked=busy();
  if(state==='PLAYER1_RECORD')html+=stage(t('recordTitle'),t('recordHint'),wave()+`<div class="actions">${recordControls('recordOriginal',original?'rerecord':'record')}${original?`<span class="pill">${t('originalReady')} · ${num(Number(original.duration.toFixed(1)))} ${t('seconds')}</span>${button('handoff',t('handoff'),'secondary',locked)}`:''}</div>`);
  if(state==='HANDOFF')html+=`<section class="card center"><div class="orb">⇄</div><p class="eyebrow">${t('handoffTitle')}</p><h2 id="stageTitle">${name(1-match.speaker)}</h2><p class="sub">${t('handoffHint')}</p><div class="actions">${button('ready',t('imReady'),'primary big')}</div></section>`;
  if(state==='PLAYER2_LISTEN')html+=stage(t('listenTitle'),t('listenHint'),wave()+`<div class="actions">${controls('playClue','playClue')}${button('imitate',t('toImitate'),'primary',locked||!heard)}</div>`);
  if(state==='PLAYER2_IMITATE')html+=stage(t('imitateTitle'),t('imitateHint'),wave()+`<div class="actions">${phase==='idle'||phase==='playing'?controls('playClue','playClue'):''}${recordControls('recordImitation','recordImitation')}</div>`);
  if(state==='PLAYER2_LISTEN_RESULT')html+=stage(t('resultTitle'),t('resultHint'),wave()+`<div class="actions">${controls('playResult','playResult')}${button('playRaw',t('playRaw'),'ghost',locked)}${button('retry',t('rerecord'),'ghost',locked)}${button('guess',t('toGuess'),'primary',locked||!resultHeard)}</div>`);
  if(state==='GUESS')html+=stage(t('guessTitle'),t('guessHint'),`<label for="guess">${t('guessLabel')}</label><input id="guess" maxlength="250" value="${esc(guess)}" placeholder="${t('guessPlaceholder')}" autocomplete="off"><div class="actions">${button('reveal',t('reveal'),'primary big')}</div>`);
  if(state==='REVEAL')html+=stage(t('revealTitle'),t('revealHint'),(guess?`<div class="guess">${esc(guess)}</div>`:'')+wave()+`<div class="actions">${controls('playOriginal','playOriginal')}${button('judge',t('judge'),'primary',locked||!originalHeard)}</div>`);
  if(state==='SCORING')html+=stage(t('scoringTitle'),t('scoringHint'),(guess?`<div class="guess">${esc(guess)}</div>`:'')+wave()+`<div class="actions">${controls('playOriginal','playOriginal')}${button('correct',t('correct'),'primary big',locked)}${button('incorrect',t('incorrect'),'ghost',locked)}</div>`);
  if(state==='NEXT_ROUND')html+=`<section class="card center"><div class="orb celebrate">${lastCorrect?'✦':'⇄'}</div><h2 id="stageTitle">${lastCorrect?t('point')+' '+name(1-match.speaker):t('noPoint')}</h2><p class="sub">${t('nextTitle')}</p><p class="hint">${t('speaker')}: ${name(1-match.speaker)} · ${t('guesser')}: ${name(match.speaker)}</p><div class="actions">${button('next',t('next'),'primary big')}</div></section>`;
  if(state==='GAME_OVER'){const winner=match.scores[0]>=match.target?0:1;html+=`<section class="card center celebrate"><div class="orb">♛</div><p class="eyebrow">${t('winner')}</p><h2 id="stageTitle">${name(winner)}</h2><p class="sub">${t('final')}: <bdi>${num(match.scores[0])} — ${num(match.scores[1])}</bdi></p><div class="actions">${button('again',t('again'),'primary big')}</div></section>`;}
 }
 $('app').innerHTML=html;$('tools').innerHTML=state==='SETUP'?'':button('reset',t('reset'),'ghost');
 $('confirmTitle').textContent=t('resetTitle');$('confirmText').textContent=t('resetText');$('confirmYes').textContent=t('resetYes');$('confirmNo').textContent=t('cancel');
 if($('customTarget'))$('customTarget').required=$('target').value==='custom';
}
function rememberSetup(){if(state!=='SETUP')return;match.names=[$('name1').value.trim().slice(0,40),$('name2').value.trim().slice(0,40)];const target=Number($('target').value==='custom'?$('customTarget').value:$('target').value);if(Number.isInteger(target)&&target>=1&&target<=999)match.target=target;}
function begin(resume=false){
 if(state!=='SETUP'&&state!=='GAME_OVER')return;
 if(!resume){rememberSetup();match.names=match.names.map((n,i)=>n||t('default'+(i+1)));match.scores=[0,0];match.speaker=0;match.round=1;}
 match.active=true;freeRound();save();
 const won=match.scores.some(s=>s>=match.target);go(won?'GAME_OVER':'PLAYER1_RECORD');if(won)celebrate();else if(resume)toast(t('reloaded'));
}
async function record(which){
 const expected=which==='original'?'PLAYER1_RECORD':'PLAYER2_IMITATE';if(state!==expected||busy())return;
 const op=++operation;phase='preparing';showError('');render();
 try{
  const buffer=await audio.record(()=>{if(op===operation){phase='recording';render();}},()=>{if(op===operation){phase='processing';render();}});
  if(op!==operation||state!==expected)return;
  if(buffer.duration<.5)throw fault('short');
  const rev=reverseBuffer(audio.context,buffer);phase='idle';
  if(which==='original'){original=buffer;reversed=rev;render();}else{imitation=buffer;result=rev;resultHeard=false;go('PLAYER2_LISTEN_RESULT');}
 }catch(error){if(op!==operation)return;phase='idle';audio.dispose();render();if(error.code!=='aborted')showError(errorText(error));}
}
async function play(kind){
 if(busy())return;
 const allowed={clue:['PLAYER2_LISTEN','PLAYER2_IMITATE'],result:['PLAYER2_LISTEN_RESULT'],raw:['PLAYER2_LISTEN_RESULT'],original:['REVEAL','SCORING']};
 if(!allowed[kind]?.includes(state))return;
 const buffer={clue:reversed,result,raw:imitation,original}[kind];if(!buffer)return;
 const op=++operation;phase='playing';showError('');render();
 try{await audio.play(buffer,()=>{if(op!==operation)return;phase='idle';if(kind==='clue')heard=true;if(kind==='result')resultHeard=true;if(kind==='original')originalHeard=true;render();});}
 catch(error){if(op!==operation)return;phase='idle';audio.stopPlayback();render();if(error.code!=='aborted')showError(error.code==='unsupported'?t('unsupported'):t('playError'));}
}
function score(correct){
 if(state!=='SCORING'||busy())return;
 const player=1-match.speaker;lastCorrect=correct;if(correct)match.scores[player]++;
 const won=match.scores[player]>=match.target;match.active=true;
 // Persist the next round checkpoint: reload cannot score a finished round twice.
 freeRound();go(won?'GAME_OVER':'NEXT_ROUND');save();
 if(won)celebrate();else if(correct)toast(t('point')+' '+match.names[player]);
}
function celebrate(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;$('party').replaceChildren();for(let i=0;i<45;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'%';el.style.background=['#9bf0ce','#aa8aff','#ff86ad','#ffda8a'][i%4];el.style.animationDelay=Math.random()*.7+'s';$('party').append(el);}setTimeout(()=>$('party').replaceChildren(),4000);}
function reset(){freeRound();match.scores=[0,0];match.speaker=0;match.round=1;match.active=false;state='SETUP';message='';save();render();}
function cancelAudio(){operation++;audio.dispose();phase='idle';render();}
const actions={
 resume:()=>begin(true),recordOriginal:()=>record('original'),recordImitation:()=>record('imitation'),
 stopRecord:()=>{if(phase!=='recording')return;phase='processing';render();audio.stop();},cancelAudio,
 handoff:()=>{if(original&&reversed&&!busy())go('HANDOFF');},ready:()=>go('PLAYER2_LISTEN'),
 playClue:()=>play('clue'),playResult:()=>play('result'),playRaw:()=>play('raw'),playOriginal:()=>play('original'),
 stopPlay:()=>{operation++;audio.stopPlayback();phase='idle';render();},
 imitate:()=>{if(heard&&!busy())go('PLAYER2_IMITATE');},retry:()=>{if(!busy())go('PLAYER2_IMITATE');},
 guess:()=>{if(resultHeard&&!busy())go('GUESS');},reveal:()=>{guess=$('guess')?.value.trim().slice(0,250)||'';go('REVEAL');},judge:()=>{if(originalHeard&&!busy())go('SCORING');},
 correct:()=>score(true),incorrect:()=>score(false),next:()=>{if(state!=='NEXT_ROUND')return;match.speaker=1-match.speaker;match.round++;save();go('PLAYER1_RECORD');},again:()=>begin(false),
 reset:()=>{if(!$('confirm').open)$('confirm').showModal();}
};
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const handler=actions[b.dataset.action];if(handler)Promise.resolve().then(handler).catch(e=>showError(errorText(e)));});
document.addEventListener('submit',event=>{if(event.target.id==='setup'){event.preventDefault();if(event.target.reportValidity())begin();}});
document.addEventListener('change',event=>{if(event.target.id==='target'){$('customWrap').hidden=event.target.value!=='custom';$('customTarget').required=event.target.value==='custom';}if(state==='SETUP'&&event.target.id!=='language'&&!match.active){rememberSetup();save();}});
$('language').addEventListener('change',()=>{if(busy())return;if(state==='SETUP'&&!match.active)rememberSetup();if(state==='GUESS')guess=$('guess').value;lang=$('language').value==='en'?'en':'fa';message='';save();render();});
$('confirmNo').onclick=()=>$('confirm').close();$('confirmYes').onclick=()=>{$('confirm').close();reset();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)return;if(['recording','preparing','processing'].includes(phase)){cancelAudio();showError(t('hidden'));}else if(phase==='playing'){operation++;audio.stopPlayback();phase='idle';render();}});
window.addEventListener('pagehide',()=>{operation++;audio.dispose();phase='idle';});
window.addEventListener('pageshow',event=>{if(event.persisted){phase='idle';render();}});
// One animation loop, independent of UI redraws. No synthetic recording waveform.
function draw(){
 const canvas=$('wave');if(canvas){const ctx=canvas.getContext('2d');if(ctx){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.lineWidth=2.5;ctx.strokeStyle=phase==='recording'?'#ff86ad':'#9bf0ce';ctx.beginPath();const analyser=audio.analyser,values=analyser?new Uint8Array(analyser.fftSize):null;if(analyser)analyser.getByteTimeDomainData(values);for(let i=0;i<w;i++){const y=values?(values[Math.floor(i/w*values.length)]/128-1)*h*.43+h/2:h/2;if(i===0)ctx.moveTo(i,y);else ctx.lineTo(i,y);}ctx.stroke();}
  if($('clock')&&phase==='recording')$('clock').textContent=Math.max(0,MAX_SECONDS-(performance.now()-audio.startedAt)/1000).toFixed(1)+' / 10 s';
 }
 requestAnimationFrame(draw);
}
render();requestAnimationFrame(draw);
})();
